<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Explainers</title>
<style>
:root{--ink:#1a1a1a;--paper:#FFE566;--panel:#fff;--grey:#E9E9E9;--pink:#FF4D9D;--shadow:6px 6px 0 var(--ink)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font:17px/1.6 "Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;max-width:920px;padding:28px 20px 60px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-size:clamp(36px,7vw,64px);line-height:1.05;letter-spacing:-.01em;font-weight:700;margin:0 0 28px;max-width:11em}
.search{position:relative;max-width:640px}
input{width:100%;font:500 24px/1.2 "Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;padding:16px 20px;border:4px solid var(--ink);background:var(--grey);box-shadow:var(--shadow)}
input:focus{outline:none;background:#fff}
input::placeholder{color:#666;font-weight:400}
.drop{margin-top:14px;border:4px solid var(--ink);background:var(--grey);box-shadow:var(--shadow)}
.drop .item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--ink);font-weight:600;font-size:20px;text-decoration:none;color:var(--ink)}
.drop .item:hover{background:var(--ink);color:#fff}
.drop .item:last-child{border-bottom:0}
.tag{font-size:13px;font-weight:600;border:3px solid var(--ink);padding:2px 8px;background:var(--pink);color:#fff}
.drop .hint{padding:12px 16px;font-weight:400;color:#333;background:#f5f5f5}
.foot{margin-top:60px;font-size:14px}
.foot a{color:var(--ink)}
</style></head><body>
<h1>What do you want to understand?</h1>
<div class="search">
  <input placeholder="try: bloom filter" autofocus>
  <div class="drop">
    <a class="item" href="explainer.html">Bloom filter <span class="tag">built</span></a>
    <div class="hint">Or type to search about 200 concepts: hash table, merkle tree, consistent hashing, lru cache...</div>
  </div>
</div>
<p class="foot">Every answer here is decided on your device against a fixed list. Nothing is sent anywhere. <a href="#">How the list was checked</a></p>
</body></html>
