:root{--ink:#3D372F;--ink-soft:#6B6355;--ink-field:#4A433A;--butter:#FFEFB8;--paper:#FDFAF1;--bulb:#FFC93C;--berry:#B3325B;--mint:#1F8A70;--shadow:4px 4px 0 var(--ink)}
*{box-sizing:border-box}
html{background:var(--butter)}
body{margin:0;color:var(--ink);font:17px/1.7 Fredoka,"Avenir Next","Segoe UI",system-ui,sans-serif;max-width:920px;padding:28px 20px 60px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-size:clamp(34px,6.4vw,60px);line-height:1.12;letter-spacing:-.005em;font-weight:600;margin:0 0 28px;max-width:11em}
.search{position:relative;max-width:640px}
input{width:100%;font-family:inherit;font-size:24px;font-weight:500;line-height:1.2;padding:16px 20px;color:var(--ink-field);border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
input:focus{outline:none;background:#fff}
input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
input::placeholder{color:#9A9182;font-weight:400}
.drop{margin-top:14px;border:2px solid var(--ink);border-radius:14px;background:#FFFDF6;box-shadow:var(--shadow);display:none;overflow:hidden}
.drop.show{display:block}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line,#E3DCC9);font-weight:500;font-size:20px;text-decoration:none;color:var(--ink);gap:12px}
.item:last-child{border-bottom:0}
a.item:hover,a.item:focus,.item.sel{background:var(--ink);color:var(--butter);outline:none}
.item.plain{cursor:default;font-weight:500;color:var(--ink-soft)}
.tag{font-size:13px;font-weight:500;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--mint);color:#fff;white-space:nowrap}
.tag.off{background:transparent;color:var(--ink-soft);border-color:var(--ink-soft)}
.hint{padding:12px 16px;font-weight:400;color:var(--ink-soft);background:#FBF7EA}
.msg{padding:14px 16px;background:#FFFDF6}
.msg b{display:block;margin-bottom:6px}
.msg a{display:inline-block;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;text-decoration:none;font-weight:500;background:var(--bulb);box-shadow:2px 2px 0 var(--ink);margin:6px 8px 0 0}
.foot{margin-top:60px;font-size:14px;color:var(--ink-soft)}
.foot a{color:var(--ink)}

:"diffie-hellman","aliases":["diffie hellman","key exchange"],"path":null},{"name":"password hashing","aliases":["bcrypt","salt"],"path":null},{"name":"oauth","aliases":["oauth2"],"path":null},{"name":"jwt","aliases":["json web token"],"path":null},{"name":"cors","aliases":[],"path":null},{"name":"xss","aliases":["cross-site scripting"],"path":null},{"name":"sql injection","aliases":[],"path":null},{"name":"csrf","aliases":["cross-site request forgery"],"path":null},{"name":"zero-knowledge proof","aliases":["zero knowledge proof","zkp"],"path":null},{"name":"hmac","aliases":[],"path":null},{"name":"man-in-the-middle","aliases":["mitm"],"path":null},{"name":"two-factor authentication","aliases":["2fa","mfa"],"path":null},{"name":"blockchain","aliases":[],"path":null},{"name":"proof of work","aliases":[],"path":null},{"name":"rest","aliases":["rest api","restful"],"path":null},{"name":"graphql","aliases":[],"path":null},{"name":"grpc","aliases":[],"path":null},{"name":"json","aliases":[],"path":null},{"name":"protobuf","aliases":["protocol buffers"],"path":null},{"name":"dom","aliases":["document object model"],"path":null},{"name":"event loop","aliases":[],"path":null},{"name":"promise","aliases":["async await","async"],"path":null},{"name":"virtual dom","aliases":[],"path":null},{"name":"server-side rendering","aliases":["ssr"],"path":null},{"name":"cookie","aliases":["cookies"],"path":null},{"name":"session","aliases":[],"path":null},{"name":"url","aliases":["uri"],"path":null},{"name":"base64","aliases":[],"path":null},{"name":"unicode","aliases":["utf-8","utf8"],"path":null},{"name":"compiler","aliases":[],"path":null},{"name":"interpreter","aliases":[],"path":null},{"name":"just-in-time compilation","aliases":["jit"],"path":null},{"name":"abstract syntax tree","aliases":["ast"],"path":null},{"name":"bytecode","aliases":[],"path":null},{"name":"type system","aliases":["static typing","type checking"],"path":null},{"name":"closure","aliases":[],"path":null},{"name yes' theorem","bayesian"],"path":null},{"name":"entropy","aliases":["information entropy"],"path":null},{"name":"softmax","aliases":[],"path":null},{"name":"activation function","aliases":["relu","sigmoid"],"path":null},{"name":"loss function","aliases":[],"path":null},{"name":"cross-validation","aliases":[],"path":null}];   // [{name, aliases, path|null}]
const norm=s=>{s=s.trim().toLowerCase().replace(/\s+/g,' ');return (s.length>4&&s.endsWith('s')&&!s.endsWith('ss'))?s.slice(0,-1):s;};
const index=new Map();
for(const c of LIST)for(const k of [c.name,...c.aliases])index.set(norm(k),c);
const built=LIST.filter(c=>c.path);
const q=document.getElementById('q'),drop=document.getElementById('drop');
let items=[],sel=-1;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function builtLinks(){return built.map(c=>'<a href="'+c.path+'">'+esc(c.name)+'</a>').join('');}
function render(html){drop.innerHTML=html;drop.classList.add('show');items=[...drop.querySelectorAll('a.item')];sel=-1;}
function hide(){drop.classList.remove('show');items=[];sel=-1;}
function matches(s){
  if(!s)return [];
  const out=[];const seen=new Set();
  for(const c of LIST){const keys=[c.name,...c.aliases];
    if(keys.some(k=>norm(k).startsWith(s))||keys.some(k=>k.toLowerCase().includes(s))){if(!seen.has(c.name)){seen.add(c.name);out.push(c);}}}
  out.sort((a,b)=>(b.path?1:0)-(a.path?1:0)||a.name.localeCompare(b.name));
  return out.slice(0,8);
}
function onFocus(){
  if(q.value.trim()){onInput();return;}
  render(built.map(c=>'<a class="item" href="'+c.path+'">'+esc(c.name)+'<span class="tag">built</span></a>').join('')
    +'<div class="hint">Or type to search about 200 concepts: hash table, merkle tree, consistent hashing, lru cache...</div>');
}
function onInput(){
  const raw=q.value,s=norm(raw);
  if(!s){onFocus();return;}
  const exact=index.get(s);
  if(exact&&exact.path){location.href=exact.path;return;}          // OQ-11: full match on a built name opens it
  const m=matches(s);
  if(m.length)render(m.map(c=>c.path?'<a class="item" href="'+c.path+'">'+esc(c.name)+'<span class="tag">built</span></a>'
                                    :'<div class="item plain">'+esc(c.name)+'<span class="tag off">no explainer yet</span></div>').join(''));
  else notSupported(raw);
}
function notYet(c){render('<div class="msg"><b>'+esc(c.name)+' is a real concept, but there is no explainer for it here yet.</b>Built so far: '+builtLinks()+'</div>');}
function notSupported(raw){render('<div class="msg"><b>No explainer for "'+esc(raw.trim().slice(0,40))+'" here.</b>Built so far: '+builtLinks()+'</div>');}
function submit(){
  const s=norm(q.value);
  if(!s){onFocus();return;}
  if(sel>=0&&items[sel]){location.href=items[sel].href;return;}
  const exact=index.get(s);
  if(exact){exact.path?location.href=exact.path:notYet(exact);return;}
  const m=matches(s);
  if(m.length===1&&m[0].path){location.href=m[0].path;return;}
  if(m.length===1){notYet(m[0]);return;}
  if(m.length){render(drop.innerHTML);return;}   // keep the list, let them pick
  notSupported(q.value);
}
q.addEventListener('focus',onFocus);
q.addEventListener('input',onInput);
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'&&items.length){e.preventDefault();sel=(sel+1)%items.length;items.forEach((it,i)=>it.classList.toggle('sel',i===sel));}
  else if(e.key==='ArrowUp'&&items.length){e.preventDefault();sel=(sel-1+items.length)%items.length;items.forEach((it,i)=>it.classList.toggle('sel',i===sel));}
  else if(e.key==='Enter'){e.preventDefault();submit();}
  else if(e.key==='Escape'){hide();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))hide();});
</script>
